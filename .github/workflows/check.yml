name: Check adaptation sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install filesystem fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler e2fsprogs
      - name: Check configuration, source files and host tests
        run: ./compile.sh check
